<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>{{ subject }}</title>
</head>
<body style="margin:0;padding:24px;background:#f4f4f4;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:#222;">
  <div style="max-width:520px;margin:0 auto;background:#fff;border-radius:8px;padding:24px;">
    <h1 style="margin:0 0 12px;font-size:20px;">Dashy Dora</h1>
    {% block content %}{% endblock %}
    <hr style="border:none;border-top:1px solid #eee;margin:24px 0;" />
    <p style="color:#999;font-size:12px;margin:0;">
      Dashy Dora · your pantry at your fingertips.<br />
      If this email looks suspicious, ignore it — you can always sign in
      directly to check your account.
    </p>
  </div>
</body>
</html>
