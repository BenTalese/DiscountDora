<!DOCTYPE html>
<html>
  <head>
    <title><%= productName %></title>

    <meta charset="utf-8">
    <meta name="description" content="<%= productDescription %>">
    <meta name="format-detection" content="telephone=no">
    <meta name="msapplication-tap-highlight" content="no">
    <meta name="viewport" content="user-scalable=no, initial-scale=1, maximum-scale=1, minimum-scale=1, width=device-width<% if (ctx.mode.cordova || ctx.mode.capacitor) { %>, viewport-fit=cover<% } %>">

    <!-- Load favicons -->
    <link rel="icon" type="image/png" sizes="192x192" href="icons/android-chrome-192x192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="icons/android-chrome-512x512.png">
    <link rel="icon" type="image/png" sizes="192x192" href="icons/web-app-manifest-192x192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="icons/web-app-manifest-512x512.png">
    <link rel="icon" type="image/png" sizes="180x180" href="icons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="96x96" href="icons/favicon-96x96.png">
    <link rel="icon" type="image/ico" href="favicon.ico">

  </head>
  <body>
    <!-- Pre-mount splash. Paints the moment HTML parses so cold-load doesn't
         flash black before Vue/Quasar mount. App.vue's onMounted removes it.
         Background tracks the OS colour scheme so it lines up with whatever
         theme themeService will pick once it boots. -->
    <style>
        #pre-mount-splash {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #E8F6F3;
            z-index: 10000;
        }
        @media (prefers-color-scheme: dark) {
            #pre-mount-splash { background: #1B2026; }
        }
        #pre-mount-splash img {
            width: clamp(120px, 24vw, 200px);
            height: auto;
            opacity: 0.85;
            animation: pre-mount-pulse 1.6s ease-in-out infinite;
        }
        @keyframes pre-mount-pulse {
            0%, 100% { opacity: 0.7; transform: scale(0.96); }
            50%      { opacity: 1;   transform: scale(1.04); }
        }
        @media (prefers-reduced-motion: reduce) {
            #pre-mount-splash img { animation: none; }
        }
    </style>
    <div id="pre-mount-splash">
        <img src="icons/web-app-manifest-512x512.png" alt="Discount Dora" />
    </div>
    <!-- quasar:entry-point -->
  </body>
</html>
