# DiscountDora — nginx config for the monolithic container image.
#
# Replaces the dev-mode `quasar serve` so the SPA is served by a real
# static-file server with the right cache headers + gzip behaviour.
#
# Today's deployment exposes the two API ports (5170 / 5172) directly
# alongside this SPA host on 5174, and the frontend resolves them via
# VITE_API_BASE_URL / VITE_MERCHANT_API_BASE_URL. The commented-out
# `/api/` blocks below are the migration path to a "single port"
# deployment when you want to expose just port 5174 externally — flip
# the frontend over to relative URLs (drop the host/port from the
# VITE_* envs) and uncomment.

server {
    listen 5174 default_server;
    listen [::]:5174 default_server;
    server_name _;

    # Static SPA. try_files lets vue-router's history mode work — every
    # non-asset path resolves to /index.html so the client-side router
    # can take it from there.
    root /app/web_app/dist/spa;
    index index.html;

    # Pre-compressed and dynamic gzip; covers the vendor.js bundles
    # which dominate transfer size.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css text/javascript text/xml
        application/javascript application/json application/xml
        application/wasm image/svg+xml;
    gzip_vary on;

    # Long-cache hashed assets; short-cache index.html so deployments
    # roll out quickly without a hard refresh.
    location ~* \.(?:js|css|woff2?|ttf|otf|png|jpg|jpeg|gif|svg|webp|ico)$ {
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Lightweight health probe so the container HEALTHCHECK has
    # something quick to hit without exercising the Python APIs.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # ── Single-port deployment hooks (off by default) ────────────────
    # location /api/ {
    #     proxy_pass http://127.0.0.1:5170;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }
    # location /mapi/ {
    #     rewrite ^/mapi/(.*)$ /$1 break;
    #     proxy_pass http://127.0.0.1:5172;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }
}
