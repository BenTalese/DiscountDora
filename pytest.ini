# Pytest config — FU-169 / PROPOSAL_TEST_SUITE_IMPROVEMENTS Phase 1.
# Single source of truth for how the suite runs locally and in CI; keeps
# `pytest` (no args) honest so contributors and CI converge on the same
# scope and behaviour.

[pytest]
# Run the whole suite by default, not just the e2e slice. The proposal's
# §3.1 "CI scope gap" was that `pytest tests/e2e/dora_api` shipped while
# the 7 domain unit-test files under `tests/` never gated merges. With
# `testpaths = tests`, `pytest` (no args) collects everything.
testpaths = tests

# Treat unexpected XPASS as failure — we already rely on this when marking
# known-failing tests so a fix doesn't silently flip the colour.
xfail_strict = true

# Concise short-summary at the end (a/A/r — all failures + skips + xfails),
# without dragging in `-v` (the test count is enough; `-v` for debugging).
addopts = -ra

# Marker registry — `pytest --strict-markers` will reject typos in
# `@pytest.mark.<name>` once we adopt -W in CI; declared now so the
# proposal's Phase-2 `-m unit` / `-m slow` selective runs land cleanly.
markers =
    unit: pure-Python, no DB / no HTTP — the cheap inner loop
    e2e: API end-to-end against the in-process Flask test client
    slow: takes more than ~1s; opt-in via -m slow or skipped by -m "not slow"
    scraper: companion / merchant_api scraper tests (currently lives in the sibling repo)

# Quiet the two warnings the proposal calls out as noise in §3.9. Both
# are environmental, not real defects; filtering them keeps the warnings
# summary signal-rich (when a *real* DeprecationWarning surfaces we can
# see it).
filterwarnings =
    # fuzzywuzzy nags about installing python-Levenshtein for speed. We
    # don't care — the assistant fuzzy-match path isn't hot enough.
    ignore:Using slow pure-python SequenceMatcher.*:UserWarning:fuzzywuzzy.fuzz
    # pytest-asyncio warns about an unset default fixture loop scope on
    # every collect. We don't use async fixtures broadly; revisit if we
    # add an async-heavy test surface.
    ignore:The configuration option .asyncio_default_fixture_loop_scope. is unset.*:pytest.PytestDeprecationWarning
